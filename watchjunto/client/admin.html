<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchJunto — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Login Page -->
  <div id="login-page" class="admin-login-page">
    <div class="admin-login-form card">
      <h2 style="margin-bottom:0.5rem">Panel de Administrador</h2>
      <p style="color:var(--text-secondary);font-size:0.875rem;margin-bottom:1.5rem">WatchJunto</p>
      <label style="font-size:0.875rem;color:var(--text-secondary);display:block;margin-bottom:0.25rem">Contraseña</label>
      <input id="admin-password" class="input" type="password" placeholder="Contraseña de administrador">
      <p id="login-error" class="hidden" style="color:var(--error);font-size:0.8125rem;margin-top:0.25rem"></p>
      <button id="admin-login-btn" class="btn btn-primary" style="margin-top:0.25rem;width:100%">Entrar</button>
    </div>
  </div>

  <!-- Admin Panel (hidden until login) -->
  <div id="admin-panel" class="hidden">
    <div class="admin-layout">

      <!-- Header -->
      <div class="admin-header">
        <h1>Panel Admin — WatchJunto</h1>
        <div style="display:flex;gap:0.75rem;align-items:center">
          <a href="/" class="btn btn-secondary">← Lobby</a>
          <button id="admin-logout" class="btn btn-ghost">Cerrar sesión</button>
        </div>
      </div>

      <!-- Create Room Section -->
      <section class="admin-section">
        <h2 class="admin-section-title">Crear sala</h2>
        <form id="create-room-form" class="create-room-form">
          <div class="form-group">
            <label for="room-name">Nombre de la sala</label>
            <input id="room-name" name="name" class="input" placeholder="Mi sala" maxlength="40" required>
          </div>
          <div class="form-group">
            <label for="room-max">Máximo de usuarios</label>
            <input id="room-max" name="maxUsers" class="input" type="number" min="2" max="10" value="10">
          </div>
          <div class="form-group full-width" style="flex-direction:row;align-items:center;gap:0.75rem">
            <input id="room-open" name="isOpen" type="checkbox" checked style="width:16px;height:16px">
            <label for="room-open" style="color:var(--text-primary)">Sala abierta</label>
          </div>
          <div class="form-group full-width" style="justify-content:flex-end;flex-direction:row">
            <button type="submit" class="btn btn-primary">+ Crear sala</button>
          </div>
        </form>
      </section>

      <!-- Active Rooms Section -->
      <section class="admin-section">
        <h2 class="admin-section-title">Salas activas</h2>
        <table id="rooms-table" class="rooms-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Usuarios</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rooms-tbody">
            <tr><td colspan="4" class="empty-state">No hay salas</td></tr>
          </tbody>
        </table>
        <div style="margin-top:1rem">
          <button id="delete-all-btn" class="btn btn-danger">🗑 Eliminar todas las salas</button>
        </div>
      </section>

      <!-- Generate Invite Section -->
      <section class="admin-section">
        <h2 class="admin-section-title">Links de invitación</h2>
        <button id="generate-invite-btn" class="btn btn-primary">+ Generar link de invitación</button>
        <div id="invite-result" class="invite-result hidden" style="margin-top:0.75rem">
          <input id="invite-url" type="text" readonly style="flex:1;background:transparent;border:none;color:var(--text-primary);font-size:0.875rem;outline:none">
          <button id="copy-invite-btn" class="btn btn-secondary">Copiar</button>
        </div>
      </section>

      <!-- Active Connections Section -->
      <section class="admin-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
          <h2 class="admin-section-title" style="margin-bottom:0;border-bottom:none">Conexiones activas</h2>
          <button id="refresh-connections-btn" class="btn btn-ghost">↻ Actualizar</button>
        </div>
        <div id="connections-list" class="connections-list">
          <div class="empty-state">No hay conexiones activas</div>
        </div>
      </section>

      <!-- Danger Zone Section -->
      <section class="admin-danger-zone">
        <h3>⚠ Zona de peligro</h3>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <button id="clear-tokens-btn" class="btn btn-danger">Revocar todos los tokens de invitación</button>
        </div>
      </section>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
