<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchJunto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/lobby.css">
</head>

<body>
  <!-- Header -->
  <header class="lobby-header">
    <span class="logo">WatchJunto</span>
    <div class="lobby-user-info">
      <span id="username-display" class="text-secondary"></span>
      <span id="admin-badge" class="badge badge-accent hidden">Admin</span>
      <button id="copy-invite-btn" class="btn btn-secondary" title="Copiar link">Copiar Link</button>
      <button id="theme-toggle" class="theme-toggle" title="Cambiar tema">
        <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="hidden">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main class="lobby-main">
    <div class="lobby-actions">
      <h2>Salas activas</h2>
      <button id="create-room-btn" class="btn btn-primary hidden">+ Crear sala</button>
    </div>
    <div id="rooms-container" class="rooms-grid">
      <div class="rooms-empty">No hay salas activas</div>
    </div>
  </main>

  <!-- Username modal -->
  <dialog id="username-modal">
    <div class="modal">
      <h3 style="margin-bottom:1rem">¿Cómo te llamas?</h3>
      <p style="margin-bottom:1rem;color:var(--text-secondary);font-size:0.875rem">Este nombre se mostrará en el chat y
        la lista de usuarios.</p>
      <input id="username-input" class="input" placeholder="Tu nombre de usuario" maxlength="20"
        style="margin-bottom:0.75rem">
      <p id="username-error" class="hidden" style="color:var(--error);font-size:0.8125rem;margin-bottom:0.5rem"></p>
      <button id="username-submit" class="btn btn-primary" style="width:100%">Entrar</button>
    </div>
  </dialog>

  <!-- Create room modal -->
  <dialog id="create-room-modal">
    <div class="modal">
      <h3 style="margin-bottom:1.25rem">Crear nueva sala</h3>
      <form id="create-room-form">
        <div style="display:flex;flex-direction:column;gap:1rem">
          <div>
            <label style="display:block;font-size:0.875rem;color:var(--text-secondary);margin-bottom:0.25rem">Nombre de
              la sala</label>
            <input id="room-name" name="name" class="input" placeholder="Mi sala de pelis" maxlength="40" required>
          </div>
          <div>
            <label style="display:block;font-size:0.875rem;color:var(--text-secondary);margin-bottom:0.25rem">Máximo de
              usuarios</label>
            <input id="room-max" name="maxUsers" class="input" type="number" min="2" max="10" value="10">
          </div>
          <div style="display:flex;align-items:center;gap:0.75rem">
            <input id="room-open" name="isOpen" type="checkbox" checked style="width:16px;height:16px">
            <label for="room-open" style="font-size:0.875rem">Sala abierta (cualquier invitado puede entrar)</label>
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:0.5rem">
            <button type="button" id="cancel-room-btn" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Crear sala</button>
          </div>
        </div>
      </form>
    </div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/lobby.js"></script>
</body>

</html>
