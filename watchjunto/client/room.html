<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchJunto — Sala</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/room.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="room-navbar">
    <a href="/" class="btn btn-ghost" style="text-decoration:none">← Lobby</a>
    <span id="room-title" class="room-title">Cargando...</span>
    <span id="user-count" class="user-count">0 usuarios</span>
    <button id="resync-btn" class="btn btn-secondary resync-btn">↻ Resync</button>
  </nav>

  <!-- Main layout -->
  <div class="room-layout">
    <!-- Player area -->
    <div class="player-area">
      <div class="url-bar">
        <input id="video-url" class="input" placeholder="Pega una URL de YouTube o ID del video..." />
        <button id="load-video-btn" class="btn btn-primary">Ir</button>
      </div>
      <div class="player-container">
        <div id="yt-player"></div>
        <div id="player-placeholder" class="player-placeholder">
          Pega una URL de YouTube arriba para comenzar
        </div>
        <div id="sync-pill" class="sync-pill synced">✓ Sincronizados</div>
      </div>
    </div>

    <!-- Desktop sidebar -->
    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="chat">Chat</button>
        <button class="sidebar-tab" data-tab="users">Usuarios</button>
      </div>
      <div id="chat-panel" class="tab-panel active">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
          <input id="chat-input" class="input" placeholder="Mensaje..." maxlength="500">
          <button id="chat-send" class="btn btn-primary">➤</button>
        </div>
      </div>
      <div id="users-panel" class="tab-panel">
        <ul id="users-list" class="users-list"></ul>
      </div>
    </div>
  </div>

  <!-- Mobile FAB -->
  <button id="chat-fab" class="chat-fab btn btn-primary" title="Abrir chat">💬</button>

  <!-- Mobile bottom drawer -->
  <div id="bottom-drawer" class="bottom-drawer">
    <div class="bottom-drawer-handle"></div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab drawer-tab active" data-tab="chat-drawer">Chat</button>
      <button class="sidebar-tab drawer-tab" data-tab="users-drawer">Usuarios</button>
    </div>
    <div id="chat-panel-drawer" class="tab-panel active">
      <div id="chat-messages-drawer" class="chat-messages"></div>
      <div class="chat-input-area">
        <input id="chat-input-drawer" class="input" placeholder="Mensaje..." maxlength="500">
        <button id="chat-send-drawer" class="btn btn-primary">➤</button>
      </div>
    </div>
    <div id="users-panel-drawer" class="tab-panel">
      <ul id="users-list-drawer" class="users-list"></ul>
    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay" class="overlay-error hidden">
    <h2 id="error-title">Error</h2>
    <p id="error-message" style="color:var(--text-secondary);text-align:center;max-width:400px"></p>
    <a href="/" class="btn btn-primary">← Volver al lobby</a>
  </div>

  <script src="js/app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/player.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
