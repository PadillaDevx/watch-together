version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: watchjunto
      POSTGRES_USER: watchjunto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchjunto"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://watchjunto:${DB_PASSWORD}@db:5432/watchjunto
      PORT: 3001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SECRET_KEY: ${SECRET_KEY}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run --prefix apps/server db:migrate && node apps/server/dist/db/seed.js && npm start"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  postgres_data:
